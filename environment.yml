name: opensg_2_0
channels:
  - conda-forge
dependencies:
  - python=3.13
  - numpy
  - scipy
  - mpi4py
  - meshio
  # CPU petsc: --solver iter 4 (gamg) runs everywhere, GPU-less included.
  # GPU gamg (aijcusparse): replace this ONE line with the PINNED pair
  #   - petsc=3.23.7=cuda12_real_*
  #   - petsc4py=3.23.7
  # (the pin keeps python 3.13 -- unpinned cuda petsc4py has no py313
  # build and drags the whole env down to python 3.10)
  - petsc4py
  - pyyaml
  - fenics-dolfinx=0.8.0
  - fenics-basix=0.8.0
  - fenics-ufl=2024.1.0
  - fenics-ffcx=0.8.0
  - mpich
  - matplotlib
  - pyvista
  - numba
  - psutil
  - pip
  - pip:
    # JAX stack -- GPU (CUDA 12) by DEFAULT: the env works on any
    # machine (jax falls back to CPU where no GPU exists; the nvidia
    # wheels ~2.5 GB are the only cost there).  For a lean CPU-only
    # env replace jax[cuda12] + cupy-cuda12x with:
    #   - jax==0.10.2
    #   - jaxlib==0.10.2
    - jax[cuda12]
    - cupy-cuda12x
    - jaxopt
    - flax
    - libigl
    - pyamg
    - pypardiso
    - windio
    - -e .
