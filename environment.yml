name: opensg_2_0
channels:
  - conda-forge
dependencies:
  - python=3.13
  - numpy
  - scipy
  - mpi4py
  - meshio
  # petsc = --solver iter 4 (gamg), CUDA-12 by default like the jax
  # stack below (a CUDA petsc still runs on CPU-only machines; it just
  # cannot offer the aijcusparse Mat type, and sg_gamg probes for that
  # and falls back to aij).  The VERSION PIN is load-bearing: unpinned,
  # conda resolves a petsc4py with no python-3.13 build and drags the
  # whole env down to python 3.10.  Lean CPU-only alternative:
  #   - petsc4py
  - petsc=3.23.7=cuda12_real_*
  - petsc4py=3.23.7
  - pyyaml
  # basix supplies the reference bases/quadrature fe_jax evaluates
  # (fe_jax.basis_quadrature).  The DOLFINx stack (fenics-dolfinx, -ufl,
  # -ffcx) is NOT imported anywhere in src and is deliberately absent:
  # dolfinx 0.8.0 hard-pins petsc <3.22, which blocks the CUDA petsc
  # above.
  - fenics-basix=0.8.0
  - mpich
  - matplotlib
  - pyvista
  - numba
  - psutil
  - pip
  - pip:
    # JAX stack -- GPU (CUDA 12) by DEFAULT: the env works on any
    # machine (jax falls back to CPU where no GPU exists; the nvidia
    # wheels ~2.5 GB are the only cost there).  For a lean CPU-only
    # env replace jax[cuda12] + cupy-cuda12x with:
    #   - jax==0.10.2
    #   - jaxlib==0.10.2
    - jax[cuda12]
    - cupy-cuda12x
    - jaxopt
    - flax
    - libigl
    - pyamg
    - pypardiso
    - windio
    - -e .
