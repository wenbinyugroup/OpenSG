name: opensg_2_0
channels:
  - conda-forge
dependencies:
  - python=3.13
  - numpy
  - scipy
  - mpi4py
  - meshio
  - petsc4py
  - pyyaml
  - fenics-dolfinx=0.8.0
  - fenics-basix=0.8.0
  - fenics-ufl=2024.1.0
  - fenics-ffcx=0.8.0
  - mpich
  - matplotlib
  - pyvista
  - numba
  - psutil
  - pip
  - pip:
    # JAX stack -- GPU (CUDA 12) by DEFAULT: the env works on any
    # machine (jax falls back to CPU where no GPU exists; the nvidia
    # wheels ~2.5 GB are the only cost there).  For a lean CPU-only
    # env replace jax[cuda12] + cupy-cuda12x with:
    #   - jax==0.10.2
    #   - jaxlib==0.10.2
    - jax[cuda12]
    - cupy-cuda12x
    - jaxopt
    - flax
    - libigl
    - pyamg
    - pypardiso
    - windio
    - -e .
