[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opensg"
version = "2.2.0"
description = "OpenSG: multiscale structural mechanics by the Mechanics of Structure Genome (MSG), in JAX"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Akshat Bagla" },
    { name = "Wenbin Yu" },
    { name = "Ernesto Camarena" },
]
keywords = ["homogenization", "mechanics of structure genome", "composites", "finite elements", "jax"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "fenics-basix",
    "flax",
    "jax",
    "jaxopt",
    "libigl",
    "matplotlib",
    "meshio",
    "mpi4py",
    "numba",
    "numpy",
    "psutil",
    "pyamg",
    "pypardiso",
    "pyyaml",
    "scipy",
]

[project.urls]
Homepage = "https://github.com/wenbinyugroup/OpenSG"
Documentation = "https://github.com/wenbinyugroup/OpenSG/tree/main/docs"
Issues = "https://github.com/wenbinyugroup/OpenSG/issues"

[project.scripts]
opensg = "opensg.cli:main"
opensg_solid = "opensg_solid.cli:main"
opensg_shell = "opensg_shell.cli:main"

[project.optional-dependencies]
cuda12 = [
    "cupy-cuda12x",
    "jax[cuda12]",
]
cuda13 = [
    "cupy-cuda13x",
    "jax[cuda13]",
]
gamg = [
    "petsc4py",
]
dev = [
    "pytest",
]
docs = [
    "sphinx",
    "pydata-sphinx-theme",
    "myst-parser",
    "sphinx-design",
    "sphinx-copybutton",
    "sphinxcontrib-mermaid",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opensg_solid = ["io/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
]
markers = [
    "slow: tests that are too expensive for the default fast suite",
]
