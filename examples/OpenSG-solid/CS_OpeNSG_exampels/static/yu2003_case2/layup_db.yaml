# layup_db.yaml -- yu2003_case2: [30/-30/-30/30] symmetric angle ply, Yu-
# Hodges-Volovoi C&S 81 (2003) sec. 6.1, L/h = 4.  PSI/INCH UNITS; p0 = 1.
# Split face load s3 = b3 = (p0/2) sin(px) -> net q = p0 sin(px).  The D16
# bending-twist coupling makes this the strongest-sigma23 case (~0.52 p0).
name: yu2003_case2
model: 1
fraction: 0.5

mesh:
  n_per_layer: 1
  elem_order: 4

plate:
  a: 4.0
  b: 0.4
  nx: 40
  ny: 4
  q0: 1.0
  static: true
  load_mode: cyl
  shell_element: S8R

bench:
  S: [4]

materials:
  yu:
    full_name: Pagano-ratio graphite/epoxy, psi set (EL/ET = 25)
    E:  [25.0e+6, 1.0e+6, 1.0e+6]
    G:  [0.5e+6, 0.5e+6, 0.2e+6]
    nu: [0.25, 0.25, 0.25]
    rho: 1.0

layup:                    # BOTTOM ply first; h = 1.0 in total
  - {material: yu, thickness: 0.25, angle:  30.0}
  - {material: yu, thickness: 0.25, angle: -30.0}
  - {material: yu, thickness: 0.25, angle: -30.0}
  - {material: yu, thickness: 0.25, angle:  30.0}
