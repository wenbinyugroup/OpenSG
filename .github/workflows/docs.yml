# Builds the OpenSG 2.x documentation (docs/, Sphinx) and publishes it with GitHub Pages under
# https://wenbinyugroup.github.io/OpenSG/OpenSG_v2_0/ . The site root keeps the OpenSG 1.0
# documentation, stored as static files on the gh-pages branch: one deployment serves both.
name: docs

on:
  push:
    branches: [main, akshat/opensg]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site (OpenSG 1.0 at the root, OpenSG 2.x under OpenSG_v2_0)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the sources
        uses: actions/checkout@v4

      - name: Check out the OpenSG 1.0 documentation (site root)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Sphinx
        run: python -m pip install -r docs/requirements.txt

      - name: Build the OpenSG 2.x documentation into site/OpenSG_v2_0
        run: |
          rm -rf site/OpenSG_v2_0
          python -m sphinx -b html docs site/OpenSG_v2_0
          rm -rf site/.git
          touch site/.nojekyll

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
